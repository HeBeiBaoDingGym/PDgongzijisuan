<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>PD私教 · 教练工资计算</title>
    
    <!-- PWA 配置 -->
    <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22PD%E7%A7%81%E6%95%99%E5%B7%A5%E8%B5%84%22%2C%22short_name%22%3A%22PD%E5%B7%A5%E8%B5%84%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23ffffff%22%2C%22theme_color%22%3A%22%231a73e8%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22pd-icon-192.png%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fpng%22%7D%2C%7B%22src%22%3A%22pd-icon-512.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PD工资">
    <link rel="apple-touch-icon" href="pd-icon-192.png">
    <meta name="theme-color" content="#1a73e8">
    
    <style>
        :root {
            --primary: #1a73e8;
            --primary-dark: #1557b0;
            --success: #0d904f;
            --danger: #d93025;
            --bg: #f5f6f8;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --text-secondary: #5f6b7a;
            --border: #e0e4e8;
            --shadow: 0 2px 12px rgba(0,0,0,0.06);
            --radius: 16px;
            --radius-sm: 10px;
            --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', 'Monaco', monospace;
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh;
            padding: 16px; padding-bottom: 24px;
            /* iOS PWA 安全区域适配 */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .app-container {
            max-width: 800px; margin: 0 auto;
        }

        .app-header {
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 12px; margin-bottom: 20px;
        }
        .app-logo {
            display: flex; align-items: center; gap: 10px; font-size: 1.3rem; font-weight: 700;
        }
        .app-logo .icon {
            width: 42px; height: 42px; border-radius: 12px;
            background: linear-gradient(135deg, #1a73e8, #4a9af5);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; color: #fff; flex-shrink: 0;
        }
        .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 10px 18px; border-radius: 25px; border: none;
            cursor: pointer; font-size: 0.9rem; font-weight: 600;
            transition: 0.2s; white-space: nowrap; text-decoration: none;
            font-family: inherit; background: #fff; color: var(--text);
            border: 1.5px solid var(--border);
        }
        .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-success { background: var(--success); color: #fff; border-color: var(--success); }
        .btn-success:hover { background: #0b7d42; }
        .btn-outline:hover { background: #f9fafb; }
        .btn-sm { padding: 8px 14px; font-size: 0.8rem; border-radius: 20px; }
        .btn-xs { padding: 4px 10px; font-size: 0.7rem; border-radius: 16px; }

        .card {
            background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow);
            padding: 18px; margin-bottom: 16px; border: 1px solid var(--border);
        }

        .info-row {
            display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px;
        }
        .info-item {
            flex: 1; min-width: 140px;
        }
        .info-item label {
            display: block; font-weight: 600; font-size: 0.8rem; margin-bottom: 4px;
            color: var(--text-secondary);
        }
        input[type="text"], input[type="date"], input[type="number"], input[type="month"] {
            width: 100%; padding: 10px 12px; border: 1.5px solid var(--border);
            border-radius: var(--radius-sm); font-size: 0.9rem; font-family: inherit;
            background: #fafbfc; transition: 0.2s;
        }
        input:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(26,115,232,0.06); }

        .table-wrapper {
            overflow-x: auto; -webkit-overflow-scrolling: touch;
            border-radius: var(--radius-sm); border: 1px solid var(--border);
            margin: 12px 0; background: #fff;
        }
        table {
            width: 100%; min-width: 680px; border-collapse: collapse;
            font-size: 0.85rem; table-layout: auto;
        }
        th {
            background: #f8fafc; padding: 12px 8px; text-align: center;
            font-weight: 700; color: var(--text-secondary); font-size: 0.75rem;
            letter-spacing: 0.03em; white-space: nowrap;
        }
        td {
            padding: 8px 6px; text-align: center; border-bottom: 1px solid #f0f2f5;
            vertical-align: middle;
        }
        td input {
            width: 100%; min-width: 60px; padding: 8px 6px; border: 1px solid #e8ecf0;
            border-radius: 6px; text-align: center; font-size: 0.85rem; font-family: inherit;
            background: #fff; transition: 0.2s;
        }
        td input:focus { border-color: var(--primary); }
        td input[type="number"] { font-family: var(--font-mono); font-weight: 500; }
        td .readonly-cell {
            display: inline-block; padding: 6px 4px; font-weight: 700;
            color: var(--primary-dark); font-family: var(--font-mono); min-width: 50px;
        }
        .delete-btn {
            background: none; border: none; color: #d93025; font-size: 1.1rem;
            cursor: pointer; padding: 4px 8px; border-radius: 50%; transition: 0.2s;
            font-weight: 700;
        }
        .delete-btn:hover { background: #fdecea; }

        .summary-row {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 12px; margin-top: 12px;
            background: #f0f7ff; border-radius: 12px; padding: 14px 18px;
            font-weight: 700; font-size: 1rem; color: var(--primary-dark);
        }
        .summary-row .total-amount {
            font-size: 1.4rem; font-family: var(--font-mono);
        }

        .empty-state {
            text-align: center; padding: 32px 16px; color: #b0b8c1; font-size: 0.9rem;
        }

        .toast {
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
            background: #2c3e50; color: #fff; padding: 10px 22px; border-radius: 20px;
            font-size: 0.85rem; font-weight: 600; z-index: 999; opacity: 0;
            pointer-events: none; transition: opacity 0.3s; letter-spacing: 0.02em;
            /* PWA 安全区域顶部距离 */
            top: calc(16px + env(safe-area-inset-top));
        }
        .toast.show { opacity: 1; pointer-events: auto; }
        .toast.success { background: #0d904f; }
        .toast.warning { background: #e67e22; }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .app-logo { font-size: 1.1rem; }
            .btn { padding: 8px 14px; font-size: 0.8rem; }
            .summary-row { font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="toast" id="toast"></div>

    <div class="app-container">
        <div class="app-header">
            <div class="app-logo">
                <div class="icon">💪</div>
                <span>PD私教 · 工资计算</span>
            </div>
            <div class="header-actions">
                <button class="btn btn-outline btn-sm" onclick="loadDemo()">📥 示例</button>
                <button class="btn btn-outline btn-sm" onclick="clearAllRows()">🗑 清空</button>
                <button class="btn btn-success btn-sm" onclick="exportCSV()">📊 导出CSV</button>
            </div>
        </div>

        <div class="card">
            <div class="info-row">
                <div class="info-item">
                    <label>👤 教练姓名</label>
                    <input type="text" id="coachName" placeholder="请输入教练姓名" onchange="saveData()">
                </div>
                <div class="info-item">
                    <label>📅 工资月份</label>
                    <input type="month" id="salaryMonth" onchange="saveData()">
                </div>
            </div>
        </div>

        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <span style="font-weight:700; font-size:0.95rem;">📋 会员课时提成明细</span>
                <button class="btn btn-primary btn-sm" onclick="addRow()">➕ 添加一行</button>
            </div>

            <div class="table-wrapper">
                <table id="salaryTable">
                    <thead>
                        <tr>
                            <th style="width:40px;">#</th>
                            <th>会员姓名</th>
                            <th>月度首节课</th>
                            <th>课时数</th>
                            <th>客单价(元)</th>
                            <th>总和(元)</th>
                            <th>剩余课时</th>
                            <th style="width:40px;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <div id="emptyHint" class="empty-state">📭 暂无记录，点击“添加一行”开始</div>

            <div class="summary-row">
                <span>💰 总课时金额（所有会员提成总和）</span>
                <span class="total-amount" id="grandTotalDisplay">¥0.00</span>
            </div>
        </div>
    </div>

    <script>
        // 注册 Service Worker 实现离线缓存
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register(
                    URL.createObjectURL(new Blob([`
                        const CACHE_NAME = 'pd-salary-v1';
                        const urlsToCache = ['/'];
                        self.addEventListener('install', event => {
                            event.waitUntil(
                                caches.open(CACHE_NAME).then(cache => cache.addAll(urlsToCache))
                            );
                        });
                        self.addEventListener('fetch', event => {
                            event.respondWith(
                                caches.match(event.request).then(response => response || fetch(event.request))
                            );
                        });
                    `], { type: 'application/javascript' }))
                );
            });
        }
    </script>

    <script>
        (function() {
            let rows = [];
            let rowIdCounter = 0;
            const STORAGE_KEY = 'pd_salary_calculator';

            const $coachName = document.getElementById('coachName');
            const $salaryMonth = document.getElementById('salaryMonth');
            const $tableBody = document.getElementById('tableBody');
            const $emptyHint = document.getElementById('emptyHint');
            const $grandTotalDisplay = document.getElementById('grandTotalDisplay');
            const $toast = document.getElementById('toast');

            const now = new Date();
            const currentMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
            if(!$salaryMonth.value) $salaryMonth.value = currentMonth;

            let toastTimer;
            function showToast(msg, type='') {
                clearTimeout(toastTimer);
                $toast.textContent = msg;
                $toast.className = 'toast '+type+' show';
                toastTimer = setTimeout(() => { $toast.className = 'toast'; }, 2000);
            }

            function saveData() {
                const data = {
                    coachName: $coachName.value.trim(),
                    salaryMonth: $salaryMonth.value,
                    rows: rows,
                    rowIdCounter: rowIdCounter
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            }

            function loadData() {
                const raw = localStorage.getItem(STORAGE_KEY);
                if(raw) {
                    const data = JSON.parse(raw);
                    $coachName.value = data.coachName || '';
                    $salaryMonth.value = data.salaryMonth || currentMonth;
                    rows = data.rows || [];
                    rowIdCounter = data.rowIdCounter || 0;
                    if(rows.length) rowIdCounter = Math.max(rowIdCounter, Math.max(...rows.map(r=>r.id))+1);
                }
            }

            function calcRowTotal(classHours, unitPrice) {
                return Math.round((parseFloat(classHours)||0) * (parseFloat(unitPrice)||0) * 100) / 100;
            }

            function updateTotals() {
                let grandTotal = 0;
                document.querySelectorAll('#tableBody tr').forEach(tr => {
                    const hoursInput = tr.querySelector('.classHours');
                    const priceInput = tr.querySelector('.unitPrice');
                    const totalSpan = tr.querySelector('.rowTotal');
                    if(hoursInput && priceInput && totalSpan) {
                        const total = calcRowTotal(hoursInput.value, priceInput.value);
                        totalSpan.textContent = '¥' + total.toFixed(2);
                        grandTotal += total;
                    }
                });
                $grandTotalDisplay.textContent = '¥' + grandTotal.toFixed(2);
            }

            function renderTable() {
                if(rows.length === 0) {
                    $tableBody.innerHTML = '';
                    $emptyHint.style.display = 'block';
                    $grandTotalDisplay.textContent = '¥0.00';
                    return;
                }
                $emptyHint.style.display = 'none';
                let html = '';
                rows.forEach((row, index) => {
                    const total = calcRowTotal(row.classHours, row.unitPrice);
                    html += `
                        <tr data-id="${row.id}">
                            <td>${index+1}</td>
                            <td><input type="text" class="memberName" value="${escapeHtml(row.memberName || '')}" placeholder="姓名" onchange="updateRowData(${row.id})"></td>
                            <td><input type="date" class="firstClassDate" value="${row.firstClassDate || ''}" onchange="updateRowData(${row.id})"></td>
                            <td><input type="number" class="classHours" value="${row.classHours || ''}" step="0.5" min="0" placeholder="0" oninput="updateRowData(${row.id}); updateTotals();"></td>
                            <td><input type="number" class="unitPrice" value="${row.unitPrice || ''}" step="0.01" min="0" placeholder="0" oninput="updateRowData(${row.id}); updateTotals();"></td>
                            <td><span class="readonly-cell rowTotal">¥${total.toFixed(2)}</span></td>
                            <td><input type="number" class="remainingHours" value="${row.remainingHours || ''}" step="1" min="0" placeholder="0" onchange="updateRowData(${row.id})"></td>
                            <td><button class="delete-btn" onclick="deleteRow(${row.id})">✕</button></td>
                        </tr>`;
                });
                $tableBody.innerHTML = html;
                updateTotals();
            }

            function escapeHtml(text) {
                return String(text).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
            }

            window.updateRowData = function(id) {
                const tr = document.querySelector(`tr[data-id="${id}"]`);
                if(!tr) return;
                const row = rows.find(r => r.id === id);
                if(row) {
                    row.memberName = tr.querySelector('.memberName')?.value || '';
                    row.firstClassDate = tr.querySelector('.firstClassDate')?.value || '';
                    row.classHours = parseFloat(tr.querySelector('.classHours')?.value) || 0;
                    row.unitPrice = parseFloat(tr.querySelector('.unitPrice')?.value) || 0;
                    row.remainingHours = parseInt(tr.querySelector('.remainingHours')?.value) || 0;
                    saveData();
                }
                updateTotals();
            };

            window.addRow = function() {
                const newRow = { id: rowIdCounter++, memberName: '', firstClassDate: '', classHours: 0, unitPrice: 0, remainingHours: 0 };
                rows.push(newRow);
                saveData();
                renderTable();
                showToast('✅ 已添加新行', 'success');
                setTimeout(() => {
                    const lastRow = document.querySelector(`tr[data-id="${newRow.id}"]`);
                    if(lastRow) lastRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 100);
            };

            window.deleteRow = function(id) {
                if(!confirm('确定删除这一行吗？')) return;
                rows = rows.filter(r => r.id !== id);
                saveData();
                renderTable();
                showToast('🗑 已删除');
            };

            window.clearAllRows = function() {
                if(rows.length === 0) return showToast('暂无记录可清空');
                if(confirm(`确定清空全部 ${rows.length} 行数据吗？`)) {
                    rows = [];
                    saveData();
                    renderTable();
                    showToast('全部记录已清空', 'warning');
                }
            };

            window.loadDemo = function() {
                if(rows.length && !confirm('加载示例将覆盖现有数据，确定吗？')) return;
                $coachName.value = '李教练';
                $salaryMonth.value = '2026-08';
                rows = [
                    { id: 0, memberName: '王小明', firstClassDate: '2026-08-03', classHours: 12, unitPrice: 200, remainingHours: 24 },
                    { id: 1, memberName: '陈雨', firstClassDate: '2026-08-05', classHours: 8, unitPrice: 220, remainingHours: 16 },
                    { id: 2, memberName: '赵强', firstClassDate: '2026-08-01', classHours: 10, unitPrice: 180, remainingHours: 30 }
                ];
                rowIdCounter = 3;
                saveData();
                renderTable();
                showToast('✅ 示例数据已加载', 'success');
            };

            window.exportCSV = function() {
                if(!rows.length) return showToast('⚠️ 没有数据可导出', 'warning');
                const coach = $coachName.value.trim() || '未填写';
                const month = $salaryMonth.value || '未选择';
                let csv = '\uFEFF';
                csv += `PD私教工作室 - 教练工资明细\n教练姓名,${coach}\n工资月份,${month}\n\n序号,会员姓名,月度首节课,课时数,客单价,总和(元),剩余课时\n`;
                let grandTotal = 0;
                rows.forEach((r, idx) => {
                    const total = calcRowTotal(r.classHours, r.unitPrice);
                    grandTotal += total;
                    csv += `${idx+1},${r.memberName},${r.firstClassDate},${r.classHours},${r.unitPrice},${total.toFixed(2)},${r.remainingHours}\n`;
                });
                csv += `\n总课时金额(元),,,${grandTotal.toFixed(2)}\n`;
                const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = `PD工资_${coach}_${month}.csv`;
                document.body.appendChild(a); a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast(`📥 导出成功`, 'success');
            };

            function init() {
                loadData();
                if(!$salaryMonth.value) $salaryMonth.value = currentMonth;
                renderTable();
                $coachName.addEventListener('change', saveData);
                $salaryMonth.addEventListener('change', saveData);
            }
            init();
        })();
    </script>
</body>
</html>
